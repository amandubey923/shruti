<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E0B36"/>
      <stop offset="50%" stop-color="#140626"/>
      <stop offset="100%" stop-color="#0D031A"/>
    </linearGradient>
    <pattern id="rings" width="200" height="200" patternUnits="userSpaceOnUse">
      <circle cx="100" cy="100" r="80" fill="none" stroke="#8B5CF6" stroke-width="1" stroke-dasharray="4 4" opacity="0.08"/>
      <circle cx="100" cy="100" r="50" fill="none" stroke="#8B5CF6" stroke-width="1" stroke-dasharray="4 4" opacity="0.08"/>
    </pattern>
  </defs>
  <rect width="600" height="800" rx="32" fill="url(#bg)"/>
  <rect width="600" height="800" fill="url(#rings)"/>
  <rect x="24" y="24" width="552" height="752" rx="20" fill="none" stroke="#8B5CF6" stroke-width="1.5" stroke-opacity="0.35"/>
  <circle cx="36" cy="36" r="3" fill="#C4B5FD" opacity="0.5"/>
  <circle cx="564" cy="36" r="3" fill="#C4B5FD" opacity="0.5"/>
  <circle cx="36" cy="764" r="3" fill="#C4B5FD" opacity="0.5"/>
  <circle cx="564" cy="764" r="3" fill="#C4B5FD" opacity="0.5"/>
  
  <!-- Header Badge -->
  <g transform="translate(300, 75)">
    <rect x="-80" y="-14" width="160" height="28" rx="14" fill="#5B21B6" fill-opacity="0.3" stroke="#8B5CF6" stroke-width="1" stroke-opacity="0.4"/>
    <text text-anchor="middle" y="4" fill="#DDD6FE" font-family="sans-serif" font-size="11" font-weight="600" letter-spacing="3">SHRUTI • ARCHIVE</text>
  </g>

  <!-- Central Motif -->
  <g transform="translate(300, 260)">
    <circle cx="0" cy="0" r="36" fill="none" stroke="#C4B5FD" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.7"/>
    <circle cx="0" cy="0" r="24" fill="none" stroke="#C4B5FD" stroke-width="1.5" opacity="0.85"/>
    <circle cx="0" cy="0" r="10" fill="none" stroke="#C4B5FD" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="3" fill="#C4B5FD"/>
    <line x1="0" y1="-44" x2="0" y2="-36" stroke="#C4B5FD" stroke-width="1.5"/>
    <line x1="0" y1="36" x2="0" y2="44" stroke="#C4B5FD" stroke-width="1.5"/>
    <line x1="-44" y1="0" x2="-36" y2="0" stroke="#C4B5FD" stroke-width="1.5"/>
    <line x1="36" y1="0" x2="44" y2="0" stroke="#C4B5FD" stroke-width="1.5"/>
  </g>

  <!-- Titles -->
  <text text-anchor="middle" x="300" y="380" fill="#F5F3FF" font-family="serif" font-size="34" font-weight="bold" letter-spacing="1">कृष्ण स्मृति</text>
  <text text-anchor="middle" x="300" y="425" fill="#DDD6FE" font-family="serif" font-size="22" font-weight="600" letter-spacing="2">KRISHNA SMRITI</text>
  
  <!-- Divider -->
  <g transform="translate(300, 465)">
    <line x1="-60" y1="0" x2="-8" y2="0" stroke="#C4B5FD" stroke-width="1" opacity="0.5"/>
    <circle cx="0" cy="0" r="2.5" fill="#C4B5FD" opacity="0.7"/>
    <line x1="8" y1="0" x2="60" y2="0" stroke="#C4B5FD" stroke-width="1" opacity="0.5"/>
  </g>

  <text text-anchor="middle" x="300" y="505" fill="#C4B5FD" font-family="serif" font-style="italic" font-size="14" opacity="0.8">The Timeless Dimensions of Krishna</text>

  <!-- Footer -->
  <g transform="translate(300, 690)">
    <text text-anchor="middle" y="-22" fill="#A78BFA" font-family="sans-serif" font-size="11" font-weight="600" letter-spacing="3" opacity="0.6">DISCOURSES BY</text>
    <text text-anchor="middle" y="2" fill="#F5F3FF" font-family="serif" font-size="20" font-weight="bold" letter-spacing="2">OSHO</text>
    <text text-anchor="middle" y="22" fill="#A78BFA" font-family="monospace" font-size="10" letter-spacing="3" opacity="0.4">SACRED ARCHIVE</text>
  </g>
</svg>

