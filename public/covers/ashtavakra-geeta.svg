<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="45%" r="75%">
      <stop offset="0%" stop-color="#311B1B" />
      <stop offset="60%" stop-color="#1A0C0C" />
      <stop offset="100%" stop-color="#0A0404" />
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="50%" stop-color="#F87171" />
      <stop offset="100%" stop-color="#DC2626" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="1000" fill="url(#bgGrad)" />

  <!-- Geometric Archival Borders -->
  <rect x="40" y="40" width="720" height="920" rx="16" fill="none" stroke="#F87171" stroke-opacity="0.25" stroke-width="1.5" />
  <rect x="52" y="52" width="696" height="896" rx="12" fill="none" stroke="#FCD34D" stroke-opacity="0.15" stroke-width="1" stroke-dasharray="6,6" />

  <!-- Sacred Geometry / Mandala Visual Identity -->
  <g transform="translate(400, 420)">
    <circle r="180" fill="none" stroke="#F87171" stroke-opacity="0.12" stroke-width="1" />
    <circle r="140" fill="none" stroke="#FCD34D" stroke-opacity="0.2" stroke-width="1.5" />
    <circle r="100" fill="none" stroke="#F87171" stroke-opacity="0.3" stroke-width="1.5" stroke-dasharray="4,4" />
    <circle r="60" fill="none" stroke="#EF4444" stroke-opacity="0.4" stroke-width="2" />
    <circle r="20" fill="none" stroke="#FCD34D" stroke-opacity="0.6" stroke-width="2" />
    <circle r="8" fill="#F87171" />
  </g>

  <!-- Header Category -->
  <text x="400" y="140" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#F87171" letter-spacing="0.3em">SHRUTI SPOKEN ARCHIVE</text>
  <line x1="320" y1="160" x2="480" y2="160" stroke="#F87171" stroke-opacity="0.4" stroke-width="1" />

  <!-- Hindi Main Title -->
  <text x="400" y="680" text-anchor="middle" font-family="'Noto Serif Devanagari', 'Martel', serif" font-size="44" font-weight="800" fill="#FFFFFF" letter-spacing="0.02em">अष्टावक्र गीता</text>

  <!-- English Title -->
  <text x="400" y="735" text-anchor="middle" font-family="'Cinzel', 'Georgia', serif" font-size="28" font-weight="700" fill="url(#goldGrad)" letter-spacing="0.1em">ASHTAVAKRA GEETA</text>

  <!-- Subtitle -->
  <text x="400" y="775" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500" fill="#94A3B8" letter-spacing="0.05em">The Song of Ultimate Freedom</text>

  <!-- Speaker & Archive Meta -->
  <text x="400" y="850" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#E2E8F0" letter-spacing="0.15em">OSHO</text>
  <text x="400" y="880" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#F87171" letter-spacing="0.2em">GREAT DISCOURSES</text>
</svg>

