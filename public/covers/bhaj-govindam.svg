<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="45%" r="75%">
      <stop offset="0%" stop-color="#1E1B4B" />
      <stop offset="60%" stop-color="#0F0D24" />
      <stop offset="100%" stop-color="#06050E" />
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="1000" fill="url(#bgGrad)" />

  <!-- Geometric Archival Borders -->
  <rect x="40" y="40" width="720" height="920" rx="16" fill="none" stroke="#F59E0B" stroke-opacity="0.25" stroke-width="1.5" />
  <rect x="52" y="52" width="696" height="896" rx="12" fill="none" stroke="#818CF8" stroke-opacity="0.15" stroke-width="1" stroke-dasharray="6,6" />

  <!-- Sacred Geometry / Mandala Visual Identity -->
  <g transform="translate(400, 420)">
    <circle r="180" fill="none" stroke="#818CF8" stroke-opacity="0.12" stroke-width="1" />
    <circle r="150" fill="none" stroke="#F59E0B" stroke-opacity="0.2" stroke-width="1.5" />
    <circle r="120" fill="none" stroke="#818CF8" stroke-opacity="0.25" stroke-width="1" stroke-dasharray="4,4" />
    <circle r="90" fill="none" stroke="#F59E0B" stroke-opacity="0.35" stroke-width="1.5" />
    <circle r="60" fill="none" stroke="#818CF8" stroke-opacity="0.4" stroke-width="2" />
    <circle r="30" fill="none" stroke="#FCD34D" stroke-opacity="0.6" stroke-width="2" />

    <!-- 8 Lotus Petals Motif -->
    <path d="M 0,-150 C 35,-100 35,-50 0,0 C -35,-50 -35,-100 0,-150 Z" fill="#818CF8" fill-opacity="0.08" stroke="#818CF8" stroke-opacity="0.3" stroke-width="1" />
    <path d="M 0,150 C 35,100 35,50 0,0 C -35,50 -35,100 0,150 Z" fill="#818CF8" fill-opacity="0.08" stroke="#818CF8" stroke-opacity="0.3" stroke-width="1" />
    <path d="M -150,0 C -100,35 -50,35 0,0 C -50,-35 -100,-35 -150,0 Z" fill="#818CF8" fill-opacity="0.08" stroke="#818CF8" stroke-opacity="0.3" stroke-width="1" />
    <path d="M 150,0 C 100,35 50,35 0,0 C 50,-35 100,-35 150,0 Z" fill="#818CF8" fill-opacity="0.08" stroke="#818CF8" stroke-opacity="0.3" stroke-width="1" />

    <!-- Core Bindu -->
    <circle r="8" fill="url(#goldGrad)" />
  </g>

  <!-- Header Category -->
  <text x="400" y="140" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#F59E0B" letter-spacing="0.3em">SHRUTI SPOKEN ARCHIVE</text>
  <line x1="320" y1="160" x2="480" y2="160" stroke="#F59E0B" stroke-opacity="0.4" stroke-width="1" />

  <!-- Hindi Main Title -->
  <text x="400" y="680" text-anchor="middle" font-family="'Noto Serif Devanagari', 'Martel', serif" font-size="44" font-weight="800" fill="#FFFFFF" letter-spacing="0.02em">भज गोविंदम्</text>

  <!-- English Title -->
  <text x="400" y="735" text-anchor="middle" font-family="'Cinzel', 'Georgia', serif" font-size="28" font-weight="700" fill="url(#goldGrad)" letter-spacing="0.1em">BHAJ GOVINDAM</text>

  <!-- Subtitle -->
  <text x="400" y="775" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500" fill="#94A3B8" letter-spacing="0.05em">Song of Devotion and Awakening</text>

  <!-- Speaker & Archive Meta -->
  <text x="400" y="850" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#E2E8F0" letter-spacing="0.15em">OSHO</text>
  <text x="400" y="880" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#F59E0B" letter-spacing="0.2em">10 PARTS • COMPLETE DISCOURSES</text>
</svg>

